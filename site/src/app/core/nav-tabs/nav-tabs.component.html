<div
  class="tab"
  *ngFor="let item of items"
  [class.active]="itemActive == item"
  (click)="itemActiveChange.emit(item)"
>
  <div class="content">
    <span>{{ item }}</span>
    <div
      class="activation-indicator"
      id="nav-tabs-activation-indicator"
      layout
      *ngIf="itemActive == item"
    ></div>
  </div>
</div>
